<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Casa Inteligente</title>

    <style>
        body {
            background: #041026;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .painel {
            width: 360px;
            background: #091730;
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid #14284b;
            text-align: center;
            box-sizing: border-box;
        }

        /* Cabeçalho superior */
        .cabecalho {
            display: flex;
            align-items: center;
            text-align: left;
            margin-bottom: 20px;
            gap: 15px;
        }

        .icone-casa {
            width: 45px;
            height: 45px;
        }

        .titulo-container h2 {
            margin: 0;
            font-size: 1.2rem;
            color: #ffffff;
            font-weight: bold;
        }

        .titulo-container h2 span {
            color: #00d2ff;
        }

        .titulo-container p {
            margin: 4px 0 0 0;
            font-size: 0.85rem;
            color: #8fa0b5;
        }

        /* Fotografia JPEG da sala */
        .foto {
            width: 100%;
            height: 160px;
            object-fit: cover;
            border-radius: 16px;
            display: block;
            margin-bottom: 16px;
        }

        /* Card da Luz da Sala */
        .card-status {
            background: #0f2242;
            border-radius: 16px;
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .card-esquerda {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .icone {
            width: 40px;
            height: 40px;
        }

        .divisor-vertical {
            width: 1px;
            height: 40px;
            background: #1c355e;
        }

        .info-status {
            text-align: left;
        }

        .info-status h1 {
            margin: 0;
            font-size: 1.1rem;
            color: #ffffff;
        }

        .status-indicador {
            margin: 4px 0 0 0;
            font-size: 0.9rem;
            color: #22c55e;
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: bold;
        }

        .bolinha-status {
            width: 8px;
            height: 8px;
            background-color: #22c55e;
            border-radius: 50%;
            display: inline-block;
        }

        .gif {
            width: 35px;
            height: auto;
        }

        /* Área da Ilustração PNG */
        .area-iluminacao {
            margin: 10px 0 20px;
        }

        .logo {
            width: 65px;
            height: auto;
        }

        /* Botão */
        button {
            width: 100%;
            background: #facc15;
            color: #091730;
            padding: 14px 20px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: background 0.2s ease, transform 0.1s ease;
        }

        button:hover {
            background: #eab308;
        }

        button:active {
            transform: scale(0.98);
        }
    </style>
</head>

<body>

    <div class="painel">

        <!-- Cabeçalho com o nome da casa inteligente -->
        <div class="cabecalho">
            <svg class="icone-casa" viewBox="0 0 24 24" fill="none" stroke="#00d2ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                <polyline points="9 22 9 12 15 12 15 22"></polyline>
                <path d="M12 7.5a2 2 0 1 0 0-4 2 2 0 0 0 0 4z"></path>
            </svg>
            <div class="titulo-container">
                <h2>Minha Casa <span>Inteligente</span></h2>
                <p>Controle sua iluminação</p>
            </div>
        </div>

        <!-- JPEG: fotografia da sala -->
        <img src="icons/sala.jpg" class="foto" alt="Sala de estar">

        <!-- Área do Card de Iluminação -->
        <div class="card-status">
            <div class="card-esquerda">
                <!-- SVG: ícone vetorial -->
                <img src="icons/light-bulb-svgrepo-com.svg" class="icone" alt="Ícone de lâmpada">
                <div class="divisor-vertical"></div>
                <div class="info-status">
                    <h1>Luz da sala</h1>
                    <div class="status-indicador">
                        <span class="bolinha-status" id="bolinha"></span>
                        <span id="resultado">Luz ligada</span>
                    </div>
                </div>
            </div>
            <!-- GIF: imagem animada -->
            <img src="icons/winterflower-star-1454_512.gif" class="gif" alt="Brilho animado">
        </div>

        <!-- PNG: ilustração de lâmpada com transparência -->
        <div class="area-iluminacao">
            <img src="icons/Light-Bulb-Free-Download-PNG.png" class="logo" alt="Ilustração de lâmpada">
        </div>

        <!-- Botão de controle -->
        <button id="btn-toggle" onclick="alternarLuz()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M18.36 6.64a9 9 0 1 1-12.73 0"></path>
                <line x1="12" y1="2" x2="12" y2="12"></line>
            </svg>
            <span id="btn-texto">Desligar luz</span>
        </button>

    </div>

    <script>
        let estaLigada = true;

        function alternarLuz() {
            const statusTexto = document.getElementById("resultado");
            const btnTexto = document.getElementById("btn-texto");
            const bolinha = document.getElementById("bolinha");

            if (estaLigada) {
                statusTexto.innerText = "Luz desligada";
                statusTexto.style.color = "#ef4444";
                bolinha.style.backgroundColor = "#ef4444";
                btnTexto.innerText = "Ligar luz";
                estaLigada = false;
            } else {
                statusTexto.innerText = "Luz ligada";
                statusTexto.style.color = "#22c55e";
                bolinha.style.backgroundColor = "#22c55e";
                btnTexto.innerText = "Desligar luz";
                estaLigada = true;
            }
        }
    </script>

</body>
</html>
